# =============================================================================
# NGINX CONFIG -- Serve React Vite SPA (static files) -- CONTAINER-LEVEL
# =============================================================================
#
# File nay duoc COPY vao Docker image tai /etc/nginx/conf.d/default.conf
# Day la nginx BEN TRONG container, KHONG phai host VPS nginx.
#
# Host VPS nginx da xu ly:
#   - SSL termination (admin.travel-vn.site / staging.admin.travel-vn.site)
#   - Reverse proxy vao container (port 9081 prod, 8081 staging)
#
# Container nginx chi xu ly:
#   1. SPA fallback  -- tat ca route tra ve index.html (React Router xu ly)
#   2. Asset caching  -- JS/CSS/images cache 1 nam (Vite hash filenames)
#   3. Gzip           -- nen response de giam bandwidth
#   4. Security        -- headers bao ve co ban
#   5. No-cache HTML   -- index.html luon load version moi nhat
#
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # GZIP COMPRESSION
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # -------------------------------------------------------------------------
    # SPA FALLBACK
    # -------------------------------------------------------------------------
    # React Router dung client-side routing.
    # Khi user refresh trang hoac truy cap truc tiep URL, nginx tra ve index.html
    # de React Router xu ly routing phia client.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # STATIC ASSETS CACHING (JS, CSS, images, fonts)
    # -------------------------------------------------------------------------
    # Vite build ra cac file co hash trong ten (VD: index-abc123.js).
    # Khi code thay doi, hash thay doi -> ten file moi -> browser tai file moi.
    # An toan khi cache lau (1 nam).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -------------------------------------------------------------------------
    # INDEX.HTML -- KHONG CACHE
    # -------------------------------------------------------------------------
    # index.html chua <script> tags tro den JS files (co hash).
    # Khi deploy version moi, index.html phai duoc tai lai.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # -------------------------------------------------------------------------
    # Docker HEALTHCHECK va monitoring tools goi endpoint nay.
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # BLOCK DOT FILES
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
