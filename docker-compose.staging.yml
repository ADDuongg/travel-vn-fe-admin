# =============================================================================
# DOCKER COMPOSE -- STAGING ENVIRONMENT (Admin)
# =============================================================================
#
# Staging dung de test truoc khi release len production.
# Host VPS nginx proxy staging.admin.travel-vn.site:443 -> 127.0.0.1:8081
#
# Cach chay:
#   docker compose -f docker-compose.staging.yml up -d
#
# Cach dung:
#   docker compose -f docker-compose.staging.yml down
#
# Xem log:
#   docker compose -f docker-compose.staging.yml logs -f
#
# Luu y:
#   - Image duoc build boi GitLab CI va push len GitLab Container Registry.
#   - Tren VPS, file nay chi pull image tu registry, KHONG build local.
#   - Bien IMAGE_TAG duoc set boi CI pipeline hoac truyen qua environment.
#
# =============================================================================

services:
  admin-web-staging:
    image: registry.gitlab.com/nvduong2302/travel-vn-fe-admin:staging-latest

    container_name: admin-frontend-staging

    # Host VPS nginx proxy staging.admin.travel-vn.site -> 127.0.0.1:8081
    ports:
      - '127.0.0.1:8081:80'

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/health',
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    networks:
      - travel-vn-dev-network

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  travel-vn-dev-network:
    name: travel-vn-dev-network
    driver: bridge
