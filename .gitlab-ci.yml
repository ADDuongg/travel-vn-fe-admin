# ===========================================================================
# STAGE 3: BUILD -- Docker build + push to registry
# ===========================================================================

build:staging:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
  script:
    - >
      docker build
      --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL
      --build-arg VITE_SOCKET_URL=$VITE_SOCKET_URL
      --build-arg VITE_APP_API_URL=$VITE_APP_API_URL
      --build-arg VITE_DROP_CONSOLE=$VITE_DROP_CONSOLE
      -t $CI_REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA
      -t $CI_REGISTRY_IMAGE:staging-latest
      .
    - docker push $CI_REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:staging-latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
  environment:
    name: staging
  tags:
    - travel-staging

build:production:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      docker build
      --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL
      --build-arg VITE_SOCKET_URL=$VITE_SOCKET_URL
      --build-arg VITE_APP_API_URL=$VITE_APP_API_URL
      --build-arg VITE_DROP_CONSOLE=$VITE_DROP_CONSOLE
      -t $CI_REGISTRY_IMAGE:prod-$CI_COMMIT_SHORT_SHA
      -t $CI_REGISTRY_IMAGE:prod-latest
      .
    - docker push $CI_REGISTRY_IMAGE:prod-$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:prod-latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  environment:
    name: production
  tags:
    - travel-production

# ===========================================================================
# STAGE 4: DEPLOY -- Pull image + restart container tren VPS
# ===========================================================================

deploy:staging:
  stage: deploy
  script:
    - cd /opt/travel-admin-fe/staging
    - echo "Login registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

    - echo "Set image tag..."
    - export IMAGE_TAG=staging-$CI_COMMIT_SHORT_SHA

    - echo "Pull latest image..."
    - docker compose -f docker-compose.staging.yml pull

    - echo "Restart container..."
    - docker compose -f docker-compose.staging.yml up -d --force-recreate

    - echo "Health check..."
    - sleep 10
    - curl -f http://127.0.0.1:8081/health || exit 1

    - echo "Deploy staging success"
  after_script:
    - docker image prune -f || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
  environment:
    name: staging
    url: https://staging.admin.travel-vn.site
  tags:
    - travel-staging

deploy:production:
  stage: deploy
  script:
    - cd /opt/travel-admin-fe/production
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export IMAGE_TAG=prod-$CI_COMMIT_SHORT_SHA
    - docker compose -f docker-compose.production.yml pull
    - docker compose -f docker-compose.production.yml up -d --force-recreate
    - echo "Health check..."
    - sleep 10
    - curl -f http://127.0.0.1:9081/health || exit 1
    - echo "Deploy production success"
  after_script:
    - docker image prune -f || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  environment:
    name: production
    url: https://admin.travel-vn.site
  tags:
    - travel-production
