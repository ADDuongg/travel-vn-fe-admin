# =============================================================================
# GITLAB CI/CD PIPELINE -- React Vite SPA (Admin)
# =============================================================================
#
# Pipeline tu dong: lint, typecheck, build Docker image, deploy len VPS.
#
# 4 STAGES:
#   1. validate  -- Lint code + TypeScript type check (chay tren MOI branch)
#   2. test      -- Unit tests (hien tai SKIP vi chua co test scripts)
#   3. build     -- Build Docker image + push len GitLab Container Registry
#                   (chi branch staging hoac production)
#   4. deploy    -- Pull image + restart container tren VPS
#                   (chi branch staging hoac production)
#
# BRANCH STRATEGY:
#   - Branch "staging"    -> build + deploy len staging  (127.0.0.1:8081 -> staging.admin.travel-vn.site)
#   - Branch "production" -> build + deploy len production (127.0.0.1:9081 -> admin.travel-vn.site)
#   - Cac branch khac     -> chi chay validate (khong deploy)
#
# GITLAB CI VARIABLES CAN THIET (Settings > CI/CD > Variables):
#   - VPS_HOST            : IP hoac domain cua VPS
#   - VPS_USER            : SSH username tren VPS
#   - SSH_PRIVATE_KEY     : SSH private key (type: File, Protected, Masked)
#   - VITE_API_BASE_URL   : API endpoint (scoped theo environment)
#   - VITE_SOCKET_URL     : Socket endpoint (scoped theo environment)
#   - VITE_APP_API_URL    : App API URL (scoped theo environment)
#   - VITE_DROP_CONSOLE   : true/false (scoped theo environment)
#
# =============================================================================

stages:
  - validate
  # - test  # Uncomment khi admin co test scripts
  - build
  - deploy

variables:
  NODE_IMAGE: node:22-alpine
  DOCKER_TLS_CERTDIR: '/certs'

cache:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/cache/
  policy: pull-push

default:
  before_script:
    - rm -rf node_modules
  after_script:
    - rm -rf node_modules dist build .vite || true
  interruptible: true

